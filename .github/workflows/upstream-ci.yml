# Reproduces strands-labs/strands-decider .github/workflows/tests.yml at pin
# 8b6faa553038a59e73fa7f16c4081f8ceb21d27e with Allowed deviations A1–A2 only.
# Source of truth: ci/upstream/tests.yml
# Local runner: uv run python scripts/extract_upstream_steps.py && bash scripts/upstream-test.sh
name: upstream-ci

on:
  push:
    branches: [main, staging]
    paths:
      - 'upstream/**'
      - '.github/workflows/upstream-ci.yml'
  pull_request:
    branches: [main, staging]
    paths:
      - 'upstream/**'
      - '.github/workflows/upstream-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  upstream-parity:
    name: upstream-parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Assert upstream pin
        run: python3 scripts/check-upstream-pin
      - name: Regenerate upstream-test.sh and fail on drift
        run: |
          python3 scripts/extract_upstream_steps.py
          git diff --exit-code scripts/upstream-test.sh
      - name: Parity check
        run: python3 scripts/check-upstream-parity

  cpu:
    name: cpu (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [upstream-parity]
    strategy:
      fail-fast: false
      matrix:
        include:
          # The tested floor versions and the lowest supported Python.
          - python: "3.10"
            torch: torch==2.7.1
            pins: transformers==5.15.0 peft==0.21.0 huggingface_hub==1.5.0
          # The newest versions that pyproject.toml admits.
          - python: "3.12"
            torch: torch
            pins: ""
    env:
      # The suite downloads nothing from the Hub. This setting makes a new download fail.
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      # Install the CPU torch wheel first. The default Linux wheel on PyPI also installs several GB of CUDA libraries.
      - run: python -m pip install "${{ matrix.torch }}" --index-url https://download.pytorch.org/whl/cpu
        working-directory: upstream
      - run: python -m pip install -e ".[dev]" pytest-cov ${{ matrix.pins }}
        working-directory: upstream
      - run: python -m pytest -q --cov=src/strands_decider --cov=training --cov-report=xml
        working-directory: upstream
      - name: Upload coverage to Codecov
        # Only from the 3.12 leg: two uploads per push double-count the same coverage.
        # Flagged `cpu` so Codecov merges this with the `mac` upload (different tests
        # cover different lines on the two runners) rather than clobbering it.
        if: matrix.python == '3.12'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: upstream/coverage.xml
          flags: cpu
          fail_ci_if_error: false

  mac:
    # Apple-silicon runner: un-skips the MPS leg of tests/test_mps_kernels.py and the whole
    # tests/test_mlx_engine.py module (both are gated on `platform.system() == "Darwin"` and
    # the mlx extra, or `torch.backends.mps.is_available()`).
    name: mac (py3.12)
    runs-on: macos-15
    timeout-minutes: 45
    needs: [upstream-parity]
    env:
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,mlx]" pytest-cov
        working-directory: upstream
      - run: python -m pytest -q --cov=src/strands_decider --cov-report=xml
        working-directory: upstream
      - name: Upload coverage to Codecov
        # Flagged `mac` so Codecov merges the MPS/MLX lines into the overall report
        # alongside the cpu upload. Each flag's own coverage still shows separately.
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: upstream/coverage.xml
          flags: mac
          fail_ci_if_error: false

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [upstream-parity]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      # Uses the detached `lint` hatch env (see pyproject.toml). It skips the project install so torch
      # and other heavy runtime deps stay out of the lint job.
      - run: python -m pip install hatch
        working-directory: upstream
      - run: hatch run lint:check
        working-directory: upstream
