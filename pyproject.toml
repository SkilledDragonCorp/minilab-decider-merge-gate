[project]
name = "decider-gate"
version = "0.1.0"
description = "SkilledDragon minilab: calibrated yes/no merge gate wrapping strands-decider"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "SkilledDragon LLC", email = "hello@skilleddragon.com" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
    "pyyaml>=6.0",
]
# Real strands-decider + CPU torch. Install with:
#   uv sync --locked --group dev --group gate
# On Linux CI and Apple silicon. Recent torch CPU wheels omit Intel macOS.
gate = [
    "strands-decider @ git+https://github.com/strands-labs/strands-decider@8b6faa553038a59e73fa7f16c4081f8ceb21d27e",
    "torch>=2.7",
]

[project.scripts]
decider-gate = "decider_gate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decider_gate"]

[tool.hatch.build.targets.wheel.sources]
"src/decider_gate" = "decider_gate"

[tool.uv]
package = true
default-groups = ["dev"]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = ["upstream"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: loads the real strands-decider checkpoint from Hugging Face",
]
addopts = "-m 'not live'"
